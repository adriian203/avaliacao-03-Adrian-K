<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ADR Motors</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="logo">ADR.motors</div>
        <nav>
            <ul>
                <li><a href="../index/index.html">Início</a></li>
                <li><a href="../produto/produto.html">Ofertas</a></li>
                <li><a href="../new/new.html">Cadastro</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>
        <a href="../login/login.html" class="btn-login">Login</a>
    </header>

    <main>
        <h1>Login</h1>
        <form action="../index/index.html" method="post" class="form-login">
            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
            </div>
            <div class="campo">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
            </div>
            <div class="acoes-form">
                <button type="submit">➜] Entrar</button>
                <a href="../new/new.html" class="btn-secundario">👤+ Criar conta</a>
            </div>
        </form>
    </main>

    <footer id="contato">
        <div class="footer-brand">ADR motors</div>
        <p>A ADR Motors é uma concessionária multimarcas que oferece os melhores veículos novos e seminovos para você.
        </p>
        <p>&copy; 2026 ADR motors. Todos os direitos reservados.</p>
    </footer>
</body>

</html>
